name: Update App Translation Checksums

on:
  push:
    paths-ignore:
      - '**/checksum'   # avoid retrigger on checksum-only commits

jobs:
  update-app-checksums:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Skip if the commit is from this workflow
        id: check_workflow
        shell: bash
        run: |
          if [[ "${{ github.event.head_commit.author.name }}" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.check_workflow.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # ensure full history so 'before' is usually reachable

      - name: Setup Git
        if: steps.check_workflow.outputs.skip == 'false'
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Determine locales that changed (root-level, bootstrap-safe)
        if: steps.check_workflow.outputs.skip == 'false'
        id: changed_locales
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          bootstrap_locales() {
            # Top-level dirs that contain at least one JSON
            mapfile -t LOCALES < <(find . -maxdepth 2 -type f -name '*.json' -printf '%P\n' \
              | sed -nE 's#^([^/]+)/.*#\1#p' \
              | grep -E '^[^./][^/]*$' \
              | sort -u)
          }

          LOCALES=()

          # Decide whether 'before' is usable; if not, bootstrap
          if [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Bootstrapping: 'before' is missing/unreachable. Hashing all top-level locale dirs with JSON."
            bootstrap_locales
          else
            # Compute changed top-level dirs from JSON diffs
            mapfile -t LOCALES < <(git diff --name-only "${BEFORE}" "${AFTER}" -- \
              | grep -E '\.json$' \
              | sed -nE 's#^([^/]+)/.*#\1#p' \
              | grep -E '^[^./][^/]*$' \
              | sort -u)

            # If no diffs but no checksum files exist yet, bootstrap
            if [ "${#LOCALES[@]}" -eq 0 ] && ! find . -maxdepth 2 -type f -name checksum | grep -q .; then
              echo "No checksum files found; bootstrapping all top-level locale dirs with JSON."
              bootstrap_locales
            fi
          fi

          if [ "${#LOCALES[@]}" -eq 0 ]; then
            echo "locales=" >> "$GITHUB_OUTPUT"
            echo "No locale changes detected."
            exit 0
          fi

          echo "locales=${LOCALES[*]}" >> "$GITHUB_OUTPUT"
          printf 'Locales to process: %s\n' "${LOCALES[*]}"

      - name: Update checksum files for locales
        if: steps.check_workflow.outputs.skip == 'false' && steps.changed_locales.outputs.locales != ''
        id: update
        shell: bash
        run: |
          set -euo pipefail
          IFS=' ' read -r -a LOCALES <<< "${{ steps.changed_locales.outputs.locales }}"
          UPDATED=""
          for locale in "${LOCALES[@]}"; do
            dir="$locale"
            if [ ! -d "$dir" ]; then
              echo "Skipping $locale (not a directory)."
              continue
            fi

            mapfile -t files < <(find "$dir" -type f -name '*.json' | sort)
            if [ "${#files[@]}" -eq 0 ]; then
              checksum=$(printf '' | sha256sum | cut -d' ' -f1)
            else
              checksum=$(cat "${files[@]}" | sha256sum | cut -d' ' -f1)
            fi

            checksum_file="$dir/checksum"
            old=""
            if [ -f "$checksum_file" ]; then
              old=$(cat "$checksum_file" || true)
            fi

            if [ "$checksum" != "$old" ]; then
              echo "$checksum" > "$checksum_file"
              git add "$checksum_file"
              UPDATED="${UPDATED}${UPDATED:+ }${locale}:${checksum}"
              echo "Updated $checksum_file -> $checksum"
            else
              echo "No change for $locale (checksum unchanged)."
            fi
          done

          echo "updated=${UPDATED}" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.check_workflow.outputs.skip == 'false' && steps.update.outputs.updated != ''
        shell: bash
        run: |
          set -euo pipefail
          UPDATED="${{ steps.update.outputs.updated }}"      # space-separated "locale:checksum" pairs
          # Extract just the locale names for a short, single-line commit message
          LOCALES_LIST=$(printf '%s\n' "$UPDATED" | tr ' ' '\n' | sed 's/:.*//' | sort -u | xargs)
          COUNT=$(printf '%s\n' "$LOCALES_LIST" | wc -w | awk '{print $1}')
          
          git status
          git commit -m "Update translation checksums [skip ci] - ${COUNT} locale(s)" || echo "No changes to commit"
          git push

      - name: Summary
        if: steps.check_workflow.outputs.skip == 'false'
        shell: bash
        run: |
          echo "## App Translation Checksum Update" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ steps.changed_locales.outputs.locales }}" ]; then
            echo "No locale JSON changes detected (or bootstrapping not needed)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Processed locales:** \`${{ steps.changed_locales.outputs.locales }}\`" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${{ steps.update.outputs.updated }}" ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "### Updated checksums" >> "$GITHUB_STEP_SUMMARY"
              # Pretty-print each locale with a short hash for readability, full under details
              while read -r pair; do
                locale="${pair%%:*}"
                hash="${pair#*:}"
                short="${hash:0:12}"
                echo "- \`${locale}\`: \`${short}\`" >> "$GITHUB_STEP_SUMMARY"
              done < <(printf '%s\n' "${{ steps.update.outputs.updated }}" | tr ' ' '\n')
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "<details><summary>Full hashes</summary>" >> "$GITHUB_STEP_SUMMARY"
              printf '%s\n' "${{ steps.update.outputs.updated }}" | tr ' ' '\n' | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "ℹ️ Checksums unchanged." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi